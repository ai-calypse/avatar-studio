name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing published GitHub Release tag (for example v0.2.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ai-calypse/avatar-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      # Keep this validation in the workflow so older release tags can be
      # backfilled without requiring new scripts in their source tree.
      - name: Validate release and inspect npm registry
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { RELEASE_TAG: tag, GITHUB_REPOSITORY: repository, GH_TOKEN: token } = process.env;
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag) || tag !== `v${pkg.version}`) {
            throw new Error(`Release tag ${tag} must match package version v${pkg.version}`);
          }
          const response = await fetch(`https://api.github.com/repos/${repository}/releases/tags/${encodeURIComponent(tag)}`, {
            headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' },
          });
          if (!response.ok) throw new Error(`Cannot read published GitHub Release: ${response.status}`);
          const release = await response.json();
          const prerelease = pkg.version.includes('-');
          if (release.draft || !release.published_at || release.prerelease !== prerelease) {
            throw new Error('Release must be published and its prerelease flag must match the package version');
          }
          if (pkg.name !== '@ai-calypse/avatar-studio') throw new Error('Unexpected package name');
          appendFileSync(process.env.GITHUB_OUTPUT, `npm-tag=${prerelease ? 'next' : 'latest'}\n`);
          const registry = await fetch(`https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/${pkg.version}`);
          if (registry.status !== 200 && registry.status !== 404) {
            throw new Error(`Cannot check npm publication status: ${registry.status}`);
          }
          const published = registry.status === 200;
          if (published) {
            const existing = await registry.json();
            if (existing.name !== pkg.name || existing.version !== pkg.version) throw new Error('Unexpected npm registry metadata');
            console.log(`${pkg.name}@${pkg.version} is already published; skipping publication.`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `already-published=${published}\n`);

          NODE

      - name: Install dependencies
        if: steps.release.outputs.already-published != 'true'
        run: npm ci --ignore-scripts

      - name: Validate MCP before release
        if: steps.release.outputs.already-published != 'true'
        run: |
          npm ci --prefix mcp --ignore-scripts
          npm run test:mcp
          npm audit --prefix mcp --audit-level=high

      - name: Audit package dependencies
        if: steps.release.outputs.already-published != 'true'
        run: npm audit --audit-level=high

      - name: Install browsers
        if: steps.release.outputs.already-published != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run full validation suite
        if: steps.release.outputs.already-published != 'true'
        run: npm test

      - name: Validate npm publish tag
        if: steps.release.outputs.already-published != 'true'
        env:
          npm_config_tag: ${{ steps.release.outputs.npm-tag }}
        run: node scripts/check-publish-tag.mjs

      # Do not let npm's dry-run setting reach the package installation tests
      # through prepublishOnly: their nested npm pack must create a real file.
      - name: Review package contents
        if: steps.release.outputs.already-published != 'true'
        env:
          NPM_TAG: ${{ steps.release.outputs.npm-tag }}
        run: npm publish --dry-run --ignore-scripts --tag "$NPM_TAG"

      - name: Publish with npm trusted publishing
        if: steps.release.outputs.already-published != 'true'
        env:
          NPM_TAG: ${{ steps.release.outputs.npm-tag }}
        # Checks passed above; do not run the browser suite a second time.
        run: npm publish --ignore-scripts --tag "$NPM_TAG"
